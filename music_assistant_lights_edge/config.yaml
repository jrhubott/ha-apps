name: "Music Assistant Edge (jrhubott)"
version: "2.11.0.dev202611271857"
slug: music_assistant_lights_edge
description: >-
  Unofficial Music Assistant build: upstream development code plus jrhubott's feature branches (fixes and features in progress). Built from
  jrhubott/music-assistant-server (edge).
url: https://github.com/jrhubott/ha-apps
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
  - mcp
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
map:
  - media:rw
  - ssl:ro
  - share:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
image: ghcr.io/jrhubott/music-assistant-lights
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
