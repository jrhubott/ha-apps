name: Build

# Builds the light-follow Music Assistant image of each channel from source and publishes the
# matching Home Assistant app. Runs after the forks' nightly sync (04:30/05:30 UTC).
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to build
        type: choice
        options: [all, stable, beta, edge]
        default: all
      force:
        description: Build even when the sources are unchanged
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the channels to build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'all' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python3 scripts/resolve.py --channel "$CHANNEL" $FORCE

  build:
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      VERSION: ${{ matrix.mass_version }}
      FRONTEND_VERSION: ${{ matrix.frontend_version }}
    steps:
      - name: Check out ha-apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ha

      - name: Check out the server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.server_repo }}
          ref: ${{ matrix.server_sha }}
          path: server

      - name: Check out the frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.frontend_repo }}
          ref: ${{ matrix.frontend_sha }}
          path: frontend

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the frontend wheel
        working-directory: frontend
        env:
          NODE_OPTIONS: --max_old_space_size=6144
        run: |
          sed -i "s/^version = \"0.0.0\"/version = \"$FRONTEND_VERSION\"/" pyproject.toml
          grep -q "^version = \"$FRONTEND_VERSION\"" pyproject.toml
          pnpm install --frozen-lockfile
          pnpm build
          pipx run build --wheel
          cp dist/music_assistant_frontend-*-py3-none-any.whl ../ha/image/

      - name: Build the server wheel
        working-directory: server
        run: |
          sed -i "s/^version = \"0.0.0\"/version = \"$VERSION\"/" pyproject.toml
          grep -q "^version = \"$VERSION\"" pyproject.toml
          test ! -e music_assistant/helpers/app_secrets.json
          pipx run build --wheel
          wheel="dist/music_assistant-$VERSION-py3-none-any.whl"
          test -f "$wheel"
          if unzip -l "$wheel" | grep -q app_secrets.json; then
            echo "::error::The server wheel contains app_secrets.json"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          IMAGE: ${{ matrix.image }}
          CHANNEL: ${{ matrix.channel }}
          APP_VERSION: ${{ matrix.version }}
          MASS_VERSION: ${{ matrix.mass_version }}
          MASS_REVISION: ${{ matrix.server_sha }}
          BASE_IMAGE_VERSION: ${{ matrix.base_image_version }}
          SERVER_REF: ${{ matrix.server_branch }}@${{ matrix.server_sha }}
          FRONTEND_REF: ${{ matrix.frontend_branch }}@${{ matrix.frontend_sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        with:
          source: .
          files: ha/docker-bake.hcl
          targets: app

      - name: Record the build
        env:
          BUILD: ${{ toJSON(matrix) }}
        run: |
          mkdir -p result
          printf '%s' "$BUILD" > "result/${{ matrix.channel }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.channel }}
          path: result/

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the branch tip, not the commit the run started from: main may have moved during the build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
      - name: Publish the app versions
        run: |
          mkdir -p results
          python3 scripts/publish.py results "$GITHUB_REPOSITORY"
          git add -A -- . ':!results'
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publish $(cd results && ls -d */ | tr -d / | sed 's/^result-//' | paste -sd, -)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -q
          done
          exit 1
